x-servico: &servico
  restart: "no"
  environment: &servico-env
    DB_USER: ${POSTGRES_USER:-parking}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-parking}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-parking}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-parking}

services:
  estacionamento:
    <<: *servico
    build: ./estacionamento
    environment:
      <<: *servico-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://estacionamento-db:5432/estacionamento
    deploy:
      replicas: ${REPLICAS_ESTACIONAMENTO:-1}
    depends_on:
      estacionamento-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  vagas:
    <<: *servico
    build: ./vagas
    environment:
      <<: *servico-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://vagas-db:5432/vagas
    deploy:
      replicas: ${REPLICAS_VAGAS:-1}
    depends_on:
      vagas-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  pagamento:
    <<: *servico
    build: ./pagamento
    environment:
      <<: *servico-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://pagamento-db:5432/pagamento
    deploy:
      replicas: ${REPLICAS_PAGAMENTO:-1}
    depends_on:
      pagamento-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  balanceador:
    image: nginx:alpine
    volumes:
      - ./escala/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    depends_on:
      - estacionamento
      - vagas
      - pagamento

  k6:
    image: grafana/k6:2.3.0
    profiles: ["k6"]
    volumes:
      - ./escala/k6:/scripts:ro
    depends_on:
      - balanceador
