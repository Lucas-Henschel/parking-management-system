spring.application.name=estacionamento
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/estacionamento}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:parking}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:parking}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:parking}

management.endpoints.web.exposure.include=health,info
