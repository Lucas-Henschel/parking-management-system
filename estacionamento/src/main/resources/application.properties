spring.application.name=estacionamento
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/estacionamento}
spring.datasource.username=${DB_USER:parking}
spring.datasource.password=${DB_PASSWORD:parking}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:parking}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:parking}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2

estacionamento.outbox.habilitada=${OUTBOX_HABILITADA:true}
estacionamento.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}
estacionamento.outbox.backoff-inicial-ms=${OUTBOX_BACKOFF_INICIAL_MS:1000}
estacionamento.outbox.backoff-maximo-ms=${OUTBOX_BACKOFF_MAXIMO_MS:300000}

management.endpoints.web.exposure.include=health,info
