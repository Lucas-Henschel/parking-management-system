worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # DNS interno do Docker; o nome do serviço devolve o IP de todas as réplicas
    # e a variável força o Nginx a resolver de novo (valid=5s) em vez de fixar no início.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8081;
        location / {
            set $destino http://estacionamento:8081;
            proxy_pass $destino;
        }
    }

    server {
        listen 8082;
        location / {
            set $destino http://vagas:8082;
            proxy_pass $destino;
        }
    }

    server {
        listen 8083;
        location / {
            set $destino http://pagamento:8083;
            proxy_pass $destino;
        }
    }
}
